[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "A reusable maze generator"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "lyang"},
    {name = "ylecain"}
]

[tool.setuptools.packages.find]
include = ["mazegen*"]